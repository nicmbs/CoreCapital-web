name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm build
      - name: Add .nojekyll and SPA fallback
        run: |
          touch dist/.nojekyll
          # GitHub Pages serves 404.html for unknown paths (e.g. /coresolutions)
          cp dist/index.html dist/404.html
          # The 404.html fallback renders the right route but answers HTTP 404.
          # Google fetches the privacy policy and terms URLs when verifying our
          # own OAuth client, so those must answer 200: give each known route a
          # real index.html.
          for route in coresolutions legal legal/terminos legal/privacidad legal/cookies; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
